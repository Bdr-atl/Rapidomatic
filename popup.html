<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="model-switcher">
            <button id="model1Button" class="active">Modèle 1 CTRL+Q</button>
            <button id="model2Button">Modèle 2 ALT+Q</button>
        </div>

        <div id="model1" class="model-content active">
            <label for="customText1">Tapez votre prénom et nom :</label>
            <input type="text" id="customText1" placeholder="Entrez un texte personnalisé">
            <label for="customMessage1">Message personnalisé :</label>
            <textarea id="customMessage1" placeholder="Entrez un message personnalisé"></textarea>
        </div>

        <div id="model2" class="model-content">
            <label for="customMessage2">Message personnalisé :</label>
            <textarea id="customMessage2" placeholder="Entrez un message personnalisé"></textarea>
        </div>

        <button id="viewReplacementsButton">Voir les remplacements de texte</button>

        <label for="uploadExcel" class="custom-upload-btn">Charger/Mise à jour du fichier Excel</label>
        <input type="file" id="uploadExcel" accept=".xlsx, .xls" hidden>	

        <div id="fileLoadedMessage" class="success-message">Fichier chargé avec succès !</div>
	<img src="files/logo.png" alt="Logo" id="logo" />

	<div class="key-users">
    	<div class="version">Version: <span id="versionNumber">Loading...</span></div>
</div>

    </div>

    <script src="popup.js"></script>
    <script src="libs/xlsx.full.min.js"></script>
</body>
</html>
